<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d2b24">
<title>FichaSpa</title>
<style>
:root{--bg:#f4efe8;--card:#fffdf9;--ink:#2a211c;--muted:#6e5e55;--line:#e4d6c8;--accent:#8b4d3b;--ok:#2f6b4f;--warn:#9a3b2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;min-height:100%}
header.app{position:sticky;top:0;z-index:20;background:#3d2b24;color:#f8f1ea;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header.app h1{margin:0;font-size:18px}.sub{opacity:.8;font-size:12px}
nav.tabs{display:flex;gap:8px;padding:10px 12px;background:#efe6dc;position:sticky;top:52px;z-index:15}
nav.tabs button{flex:1;border:0;background:#fff;border-radius:999px;padding:10px;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--accent);color:#fff}
.wrap{padding:14px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:18px 0 8px;color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px}
textarea{min-height:70px}.row,.row3{display:grid;gap:10px}.row{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.row,.row3{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
.btn-p{background:var(--accent);color:#fff}.btn-s{background:#efe6dc}.btn-g{background:var(--ok);color:#fff}.btn-d{background:#f3e4e0;color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.search{width:100%;margin-bottom:10px}
.client{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0}
.sigbox canvas{width:100%;height:140px;touch-action:none;border:1px dashed #c9b6a6;border-radius:12px}
.photos img,.mini img{object-fit:cover;border-radius:8px}.photos img{width:92px;height:92px;margin:4px}.mini img{width:64px;height:64px;margin:3px}
.hidden{display:none!important}.empty,.note{color:var(--muted);font-size:13px}
details.blk{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;background:#faf6f1}
.phblock{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a211c;color:#fff;padding:10px 16px;border-radius:999px;opacity:0}#toast.show{opacity:1}
@media print{header.app,nav.tabs,.no-print,#toast{display:none!important}.print-only{display:block!important}}.print-only{display:none}
</style></head>
<body>
<header class="app"><h1 id="spaTitle">FichaSpa</h1><div class="sub" id="spaSub">Expediente local</div></header>
<nav class="tabs no-print"><button class="on" data-tab="clientes">Clientes</button><button data-tab="nueva">Nueva ficha</button><button data-tab="ajustes">Ajustes</button></nav>
<div class="wrap">
<section id="tab-clientes"><input class="search" id="q" placeholder="Buscar"><div class="actions no-print"><button class="btn btn-p" type="button" onclick="nuevoCliente()">+ Nueva clienta</button></div><div class="card" id="lista"></div></section>
<section id="tab-nueva" class="hidden"><div class="card" id="formFicha"></div></section>
<section id="tab-ajustes" class="hidden"><div class="card"><h2>Datos del spa</h2>
<label>Nombre</label><input id="cfgNombre"><label>Terapeuta</label><input id="cfgTerapeuta">
<label>Ciudad</label><input id="cfgCiudad"><label>Telefono</label><input id="cfgTel">
<div class="actions"><button class="btn btn-p" type="button" onclick="guardarAjustes()">Guardar</button></div>
<div class="actions"><button class="btn btn-s" type="button" onclick="exportarJSON()">Exportar</button>
<button class="btn btn-s" type="button" onclick="document.getElementById('imp').click()">Importar</button>
<input id="imp" type="file" accept="application/json" class="hidden" onchange="importarJSON(event)"></div></div></section>
<div id="vistaCliente" class="hidden"></div><div id="printArea" class="print-only"></div></div><div id="toast"></div>
<script>
const COND=["Embarazo","Lactancia","Hipertension","Diabetes","Cardiacos","Epilepsia","Asma","Cancer","Tiroides","Coagulacion","Herpes","Rosacea","Acne","Eccema","Queloides","Marcapasos","Cirugia 12m","Isotretinoina","Alergia latex","Tatuaje zona","Sol reciente","Herida"];
const SERV=["Facial","Limpieza","Peeling","Masaje","Corporal","Depilacion","Cejas","Otro"];
let DB={cfg:{nombre:"Mi Spa",terapeuta:"",ciudad:"Celaya, Gto.",tel:""},clientes:[]},editId=null,visitaEdit=null,modoNV=false;
function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
function load(){try{var r=localStorage.getItem("fichaspa_v1");if(r)DB=JSON.parse(r)}catch(e){}cfg()}
function save(){localStorage.setItem("fichaspa_v1",JSON.stringify(DB))}
function esc(s){return String(s==null?"":s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""")}
function cfg(){$("spaTitle").textContent=DB.cfg.nombre||"FichaSpa";$("spaSub").textContent=DB.cfg.terapeuta||"Expediente local";$("cfgNombre").value=DB.cfg.nombre||"";$("cfgTerapeuta").value=DB.cfg.terapeuta||"";$("cfgCiudad").value=DB.cfg.ciudad||"";$("cfgTel").value=DB.cfg.tel||""}
function guardarAjustes(){DB.cfg={nombre:$("cfgNombre").value.trim()||"Mi Spa",terapeuta:$("cfgTerapeuta").value.trim(),ciudad:$("cfgCiudad").value.trim(),tel:$("cfgTel").value.trim()};save();cfg();toast("Guardado")}
document.querySelectorAll("nav.tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("nav.tabs button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");["clientes","nueva","ajustes"].forEach(function(id){$("tab-"+id).classList.toggle("hidden",b.getAttribute("data-tab")!==id)});$("vistaCliente").classList.add("hidden");if(b.getAttribute("data-tab")==="nueva"){if(!editId)modoNV=false;form()}if(b.getAttribute("data-tab")==="clientes")lista()}});
function lista(){var q=$("q").value.toLowerCase();var L=DB.clientes.filter(function(c){return !q||(c.nombre||"").toLowerCase().indexOf(q)>=0||(c.tel||"").indexOf(q)>=0});L.sort(function(a,b){return a.nombre.localeCompare(b.nombre,"es")});$("lista").innerHTML=L.length?L.map(function(c){return '<div class="client"><div><b>'+esc(c.nombre)+'</b><small>'+esc(c.tel||"")+' · '+((c.visitas||[]).length)+' visitas</small></div><button class="btn btn-s" type="button" onclick="abrir(\''+c.id+'\')">Abrir</button></div>'}).join(""):'<div class="empty">Aun no hay clientas.</div>'}
$("q").oninput=lista;
function nuevoCliente(){editId=null;visitaEdit=null;modoNV=false;document.querySelector('[data-tab=nueva]').click()}
function vacio(){return{id:uid(),nombre:"",fnac:"",edad:"",tel:"",email:"",dir:"",ocup:"",emergNombre:"",emergTel:"",emergPar:"",referido:"",alergias:"",meds:"",notasMed:"",condiciones:[],peso:"",estatura:"",cintura:"",cadera:"",busto:"",muslo:"",tipoPiel:"",fototipo:"",creado:new Date().toISOString(),visitas:[]}}
function nv(v){v=v||{};return{id:v.id||uid(),fecha:v.fecha||new Date().toISOString().slice(0,10),servicio:v.servicio||"Facial",motivo:v.motivo||"",tratamiento:v.tratamiento||"",productos:v.productos||"",reaccion:v.reaccion||"",recs:v.recs||"",fotosAntes:v.fotosAntes||v.fotos||[],fotosDespues:v.fotosDespues||[],fotosSeg:v.fotosSeg||[],notaSeg:v.notaSeg||"",firmaCli:v.firmaCli||"",firmaTer:v.firmaTer||"",acepta:!!v.acepta}}
function thumbs(a){return (a||[]).map(function(s){return '<img src="'+s+'">'}).join("")}
function form(){
 var c=(editId&&DB.clientes.find(function(x){return x.id===editId}))||vacio(); var v=nv(visitaEdit);
 var col=!!(editId&&modoNV); var op=col?"":"open";
 var ch=COND.map(function(x){return '<label><input type="checkbox" name="cond" value="'+esc(x)+'" '+(c.condiciones.indexOf(x)>=0?"checked":"")+'> '+esc(x)+'</label>'}).join("");
 $("formFicha").innerHTML='<h2>'+(!editId?"Nueva ficha":(modoNV?"Nueva visita · "+esc(c.nombre):"Editar · "+esc(c.nombre)))+'</h2>'
 +(col?'<p class="note">Datos guardados. Abre un bloque solo si hay que corregir.</p>':'')
 +'<details class="blk" '+op+'><summary>1. Datos generales</summary>'
 +'<label>Nombre</label><input id="f_nombre" value="'+esc(c.nombre)+'">'
 +'<div class="row"><div><label>Nacimiento</label><input id="f_fnac" type="date" value="'+esc(c.fnac)+'"></div><div><label>Edad</label><input id="f_edad" value="'+esc(c.edad)+'"></div></div>'
 +'<div class="row"><div><label>Telefono</label><input id="f_tel" value="'+esc(c.tel)+'"></div><div><label>Correo</label><input id="f_email" value="'+esc(c.email)+'"></div></div>'
 +'<label>Direccion</label><input id="f_dir" value="'+esc(c.dir)+'">'
 +'<div class="row"><div><label>Ocupacion</label><input id="f_ocup" value="'+esc(c.ocup)+'"></div><div><label>Como nos conocio</label><input id="f_ref" value="'+esc(c.referido)+'"></div></div>'
 +'<div class="row3"><div><label>Emergencia</label><input id="f_en" value="'+esc(c.emergNombre)+'"></div><div><label>Parentesco</label><input id="f_ep" value="'+esc(c.emergPar)+'"></div><div><label>Tel</label><input id="f_et" value="'+esc(c.emergTel)+'"></div></div></details>'
 +'<details class="blk" '+op+'><summary>2. Antecedentes</summary><div class="checkgrid">'+ch+'</div>'
 +'<label>Alergias</label><textarea id="f_alergias">'+esc(c.alergias)+'</textarea>'
 +'<label>Medicamentos</label><textarea id="f_meds">'+esc(c.meds)+'</textarea>'
 +'<label>Notas</label><textarea id="f_notasMed">'+esc(c.notasMed)+'</textarea></details>'
 +'<details class="blk" '+op+'><summary>3. Medidas</summary>'
 +'<div class="row3"><div><label>Peso</label><input id="f_peso" value="'+esc(c.peso)+'"></div><div><label>Estatura</label><input id="f_est" value="'+esc(c.estatura)+'"></div><div><label>Cintura</label><input id="f_cin" value="'+esc(c.cintura)+'"></div>'
 +'<div><label>Cadera</label><input id="f_cad" value="'+esc(c.cadera)+'"></div><div><label>Busto</label><input id="f_bus" value="'+esc(c.busto)+'"></div><div><label>Muslo</label><input id="f_mus" value="'+esc(c.muslo)+'"></div></div></details>'
 +'<h3>4. Visita de hoy</h3>'
 +'<div class="row"><div><label>Fecha</label><input id="v_fecha" type="date" value="'+esc(v.fecha)+'"></div><div><label>Servicio</label><select id="v_serv">'+SERV.map(function(s){return '<option'+(v.servicio===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div></div>'
 +'<label>Motivo</label><textarea id="v_motivo">'+esc(v.motivo)+'</textarea>'
 +'<label>Tratamiento</label><textarea id="v_trat">'+esc(v.tratamiento)+'</textarea>'
 +'<label>Productos</label><textarea id="v_prod">'+esc(v.productos)+'</textarea>'
 +'<label>Reaccion</label><textarea id="v_reac">'+esc(v.reaccion)+'</textarea>'
 +'<label>Recomendaciones</label><textarea id="v_recs">'+esc(v.recs)+'</textarea>'
 +'<div class="phblock"><h3>Fotos ANTES</h3><input type="file" accept="image/*" capture="environment" multiple onchange="addF(event,\'antes\')"><div class="photos" id="boxAntes"></div></div>'
 +'<div class="phblock"><h3>Fotos DESPUES</h3><input type="file" accept="image/*" capture="environment" multiple onchange="addF(event,\'despues\')"><div class="photos" id="boxDespues"></div></div>'
 +'<div class="phblock"><h3>Seguimiento</h3><input type="file" accept="image/*" capture="environment" multiple onchange="addF(event,\'seg\')"><div class="photos" id="boxSeg"></div>'
 +'<label>Comentario</label><textarea id="v_notaSeg">'+esc(v.notaSeg)+'</textarea></div>'
 +'<details class="blk" '+(col?'':'open')+'><summary>5. Responsiva y firmas</summary>'
 +'<p class="note">'+cons()+'</p>'
 +'<label class="note" style="display:flex;gap:8px"><input type="checkbox" id="v_ok" '+(v.acepta?'checked':'')+' style="width:18px;height:18px"> Autorizo el servicio y las fotos para el expediente.</label>'
 +'<label>Firma clienta</label><div class="sigbox"><canvas id="sigCli"></canvas></div>'
 +'<button type="button" class="btn btn-s" onclick="clr(\''+'sigCli'+'\')">Borrar</button>'
 +'<label>Firma terapeuta</label><div class="sigbox"><canvas id="sigTer"></canvas></div>'
 +'<button type="button" class="btn btn-s" onclick="clr(\''+'sigTer'+'\')">Borrar</button></details>'
 +'<div class="actions"><button class="btn btn-g" type="button" onclick="guardar()">Guardar</button><button class="btn btn-s" type="button" onclick="guardarPdf()">PDF / imprimir</button></div>';
 window._f={antes:(v.fotosAntes||[]).slice(),despues:(v.fotosDespues||[]).slice(),seg:(v.fotosSeg||[]).slice()}; window._vid=v.id; drawF(); sig("sigCli",v.firmaCli); sig("sigTer",v.firmaTer);
}
function cons(){return 'CARTA RESPONSIVA. Informe antecedentes a <b>'+esc(DB.cfg.nombre)+'</b>. Me explicaron el procedimiento. Autorizo a '+esc(DB.cfg.terapeuta||"la terapeuta")+' y el archivo fotografico del expediente.'}
function addF(ev,t){Array.prototype.forEach.call(ev.target.files,function(f){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement("canvas");var w=img.width,h=img.height,m=900;if(w>m||h>m){var s=m/Math.max(w,h);w=w*s;h=h*s}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);window._f[t].push(c.toDataURL("image/jpeg",0.72));drawF()};img.src=r.result};r.readAsDataURL(f)})}
function drawF(){[["antes","boxAntes"],["despues","boxDespues"],["seg","boxSeg"]].forEach(function(p){var b=$(p[1]);if(!b)return;b.innerHTML=(window._f[p[0]]||[]).map(function(s,i){return '<img src="'+s+'" onclick="if(confirm(\'Quitar?\')){window._f[\''+p[0]+'\'].splice('+i+',1);drawF()}">'}).join("")})}
function sig(id,ex){var c=$(id);if(!c)return;var x=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*2;c.height=280;x.scale(2,2);x.lineWidth=2;x.lineCap="round";if(ex){var i=new Image();i.onload=function(){x.drawImage(i,0,0,r.width,140)};i.src=ex}var d=0,lx=0,ly=0;function pos(e){var rr=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-rr.left,y:t.clientY-rr.top}}function st(e){e.preventDefault();d=1;var q=pos(e);lx=q.x;ly=q.y}function mv(e){if(!d)return;e.preventDefault();var q=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(q.x,q.y);x.stroke();lx=q.x;ly=q.y}c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",function(){d=0});c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",function(){d=0})}
function clr(id){var c=$(id);c.getContext("2d").clearRect(0,0,c.width,c.height)}
function sigD(id){var c=$(id);if(!c)return"";var b=document.createElement("canvas");b.width=c.width;b.height=c.height;return c.toDataURL()===b.toDataURL()?"":c.toDataURL()}
function leer(){var cond=[];document.querySelectorAll("input[name=cond]:checked").forEach(function(i){cond.push(i.value)});
 var c={id:editId||uid(),nombre:$("f_nombre").value.trim(),fnac:$("f_fnac").value,edad:$("f_edad").value,tel:$("f_tel").value,email:$("f_email").value,dir:$("f_dir").value,ocup:$("f_ocup").value,referido:$("f_ref").value,emergNombre:$("f_en").value,emergPar:$("f_ep").value,emergTel:$("f_et").value,alergias:$("f_alergias").value,meds:$("f_meds").value,notasMed:$("f_notasMed").value,condiciones:cond,peso:$("f_peso").value,estatura:$("f_est").value,cintura:$("f_cin").value,cadera:$("f_cad").value,busto:$("f_bus").value,muslo:$("f_mus").value,tipoPiel:"",fototipo:"",creado:new Date().toISOString(),visitas:[]};
 var v={id:window._vid||uid(),fecha:$("v_fecha").value,servicio:$("v_serv").value,motivo:$("v_motivo").value,tratamiento:$("v_trat").value,productos:$("v_prod").value,reaccion:$("v_reac").value,recs:$("v_recs").value,fotosAntes:window._f.antes,fotosDespues:window._f.despues,fotosSeg:window._f.seg,notaSeg:$("v_notaSeg").value,firmaCli:sigD("sigCli"),firmaTer:sigD("sigTer"),acepta:!!$("v_ok")&&$("v_ok").checked};return{c:c,v:v}}
function guardar(){var r=leer(),c=r.c,v=r.v;if(!c.nombre){toast("Falta nombre");return null}var p=DB.clientes.find(function(x){return x.id===c.id});if(p){v.id=visitaEdit?visitaEdit.id:v.id;var vs=p.visitas||[];var i=vs.findIndex(function(x){return x.id===v.id});if(i>=0)vs[i]=v;else vs.unshift(v);c.id=p.id;c.creado=p.creado;c.visitas=vs;Object.assign(p,c)}else{c.visitas=[v];DB.clientes.push(c)}editId=c.id;visitaEdit=v;save();toast("Guardado");return{c:DB.clientes.find(function(x){return x.id===c.id}),v:v}}
function guardarPdf(){var r=guardar();if(r)imp(r.c,r.v)}
function abrir(id){var c=DB.clientes.find(function(x){return x.id===id});["tab-clientes","tab-nueva","tab-ajustes"].forEach(function(i){$(i).classList.add("hidden")});$("vistaCliente").classList.remove("hidden");
 var vis=(c.visitas||[]).map(function(v){var n=nv(v);return '<div class="card"><b>'+esc(n.fecha)+' · '+esc(n.servicio)+'</b><p class="note">'+esc(n.tratamiento||n.motivo||"")+'</p>'
 +'<div class="note">Antes</div><div class="mini">'+thumbs(n.fotosAntes)+'</div><div class="note">Despues</div><div class="mini">'+thumbs(n.fotosDespues)+'</div>'
 +'<div class="note">Seguimiento</div><div class="mini">'+thumbs(n.fotosSeg)+'</div>'
 +'<div class="actions"><button class="btn btn-s" type="button" onclick="edVis(\''+c.id+'\',\''+n.id+'\')">Editar</button><button class="btn btn-s" type="button" onclick="impId(\''+c.id+'\',\''+n.id+'\')">PDF</button></div></div>'}).join("")||'<p class="note">Sin visitas</p>';
 $("vistaCliente").innerHTML='<div class="card"><h2>'+esc(c.nombre)+'</h2><p class="note">'+esc(c.tel||"")+'<br>Alergias: '+esc(c.alergias||"-")+'</p>'
 +'<div class="actions"><button class="btn btn-p" type="button" onclick="nVis(\''+c.id+'\')">+ Nueva visita</button><button class="btn btn-s" type="button" onclick="edBase(\''+c.id+'\')">Editar datos</button>'
 +'<button class="btn btn-d" type="button" onclick="bor(\''+c.id+'\')">Eliminar</button><button class="btn btn-s" type="button" onclick="document.querySelector(\'[data-tab=clientes]\').click()">Volver</button></div></div><h3>Historial</h3>'+vis}
function nVis(id){editId=id;visitaEdit=null;modoNV=true;document.querySelector('[data-tab=nueva]').click()}
function edBase(id){editId=id;visitaEdit=null;modoNV=false;document.querySelector('[data-tab=nueva]').click()}
function edVis(cid,vid){var c=DB.clientes.find(function(x){return x.id===cid});editId=cid;visitaEdit=nv((c.visitas||[]).find(function(v){return v.id===vid}));modoNV=true;document.querySelector('[data-tab=nueva]').click()}
function bor(id){if(!confirm("Eliminar?"))return;DB.clientes=DB.clientes.filter(function(c){return c.id!==id});save();document.querySelector('[data-tab=clientes]').click()}
function impId(cid,vid){var c=DB.clientes.find(function(x){return x.id===cid});imp(c,nv((c.visitas||[]).find(function(x){return x.id===vid})))}
function imp(c,v){v=nv(v);function b(t,a){return a&&a.length?'<div><b>'+t+'</b><br>'+a.map(function(s){return '<img src="'+s+'" style="width:110px;height:110px;object-fit:cover">'}).join("")+'</div>':''}
 $("printArea").innerHTML='<div style="font-family:Georgia;padding:12px"><b>'+esc(DB.cfg.nombre)+'</b><p>'+esc(c.nombre)+' · '+esc(v.fecha)+' · '+esc(v.servicio)+'</p>'
 +'<p>Alergias: '+esc(c.alergias||"-")+'</p><p>'+esc(v.tratamiento||"")+'</p>'+b("ANTES",v.fotosAntes)+b("DESPUES",v.fotosDespues)+b("SEG",v.fotosSeg)
