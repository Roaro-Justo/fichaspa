<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d2b24">
<title>FichaSpa</title>
<style>
:root{--bg:#f4efe8;--card:#fffdf9;--ink:#2a211c;--muted:#6e5e55;--line:#e4d6c8;--accent:#8b4d3b;--ok:#2f6b4f;--warn:#9a3b2a;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100%}
header.app{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#3d2b24,#5a3c32);color:#f8f1ea;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header.app h1{margin:0;font-size:18px}header.app .sub{opacity:.8;font-size:12px}
nav.tabs{display:flex;gap:8px;padding:10px 12px;background:#efe6dc;position:sticky;top:52px;z-index:15}
nav.tabs button{flex:1;border:0;background:#fff;border-radius:999px;padding:10px;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--accent);color:#fff}
.wrap{padding:14px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:18px 0 8px;color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:80px}.row,.row3{display:grid;gap:10px}.row{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.row,.row3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
.btn-p{background:var(--accent);color:#fff}.btn-s{background:#efe6dc;color:var(--ink)}.btn-g{background:var(--ok);color:#fff}.btn-d{background:#f3e4e0;color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.search{width:100%;margin-bottom:10px}
.client{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line);gap:10px}
.client small{color:var(--muted)}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;margin:0}.checkgrid input{width:18px;height:18px}
.sigbox{border:1px dashed #c9b6a6;border-radius:12px;background:#fff}.sigbox canvas{width:100%;height:160px;touch-action:none;display:block}
.photos{display:flex;flex-wrap:wrap;gap:8px}.photos img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:28px 10px}.note{font-size:12px;color:var(--muted);line-height:1.45}
.warnbox{background:#fff6f3;border:1px solid #efd3cb;border-radius:12px;padding:12px;font-size:13px;color:#6a3328}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a211c;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:50}#toast.show{opacity:1}
@media print{header.app,nav.tabs,.no-print,#toast{display:none!important}.print-only{display:block!important}}
.print-only{display:none}
</style></head><body>
<header class="app"><h1 id="spaTitle">FichaSpa</h1><div class="sub" id="spaSub">Expediente local</div></header>
<nav class="tabs no-print"><button class="on" data-tab="clientes">Clientes</button><button data-tab="nueva">Nueva ficha</button><button data-tab="ajustes">Ajustes</button></nav>
<div class="wrap">
<section id="tab-clientes"><input class="search" id="q" placeholder="Buscar por nombre o telefono"><div class="actions no-print"><button class="btn btn-p" onclick="nuevoCliente()">+ Nueva clienta</button></div><div class="card" id="lista"></div></section>
<section id="tab-nueva" class="hidden"><div class="card" id="formFicha"></div></section>
<section id="tab-ajustes" class="hidden"><div class="card"><h2>Datos del spa</h2>
<label>Nombre del spa</label><input id="cfgNombre"><label>Terapeuta</label><input id="cfgTerapeuta">
<label>Ciudad</label><input id="cfgCiudad" placeholder="Celaya, Gto."><label>Telefono</label><input id="cfgTel">
<div class="actions"><button class="btn btn-p" onclick="guardarAjustes()">Guardar ajustes</button></div>
<h3>Respaldo</h3><p class="note">Los datos se quedan en este iPad. Exporta un respaldo de vez en cuando.</p>
<div class="actions"><button class="btn btn-s" onclick="exportarJSON()">Exportar JSON</button>
<button class="btn btn-s" onclick="document.getElementById('imp').click()">Importar</button>
<input type="file" id="imp" accept="application/json" class="hidden" onchange="importarJSON(event)"></div>
<div class="warnbox" style="margin-top:12px">Herramienta de trabajo del spa.</div></div></section>
<div id="vistaCliente" class="hidden"></div><div id="printArea" class="print-only"></div></div><div id="toast"></div>
<script>
const CONDICIONES=["Embarazo","Lactancia","Hipertension","Diabetes","Problemas cardiacos","Epilepsia","Asma","Cancer","Tiroides","Coagulacion","Herpes activo","Rosacea","Acne activo","Eccema / psoriasis","Queloides","Marcapasos / metal","Cirugia reciente 12m","Isotretinoina 6-12m","Alergia latex","Tatuaje en la zona","Sol intenso reciente","Herida o infeccion"];
const SERVICIOS=["Facial","Limpieza profunda","Peeling","Masaje","Corporal","Depilacion","Cejas / pestanas","Otro"];
let DB={cfg:{nombre:"Mi Spa",terapeuta:"",ciudad:"Celaya, Gto.",tel:""},clientes:[]},editId=null,visitaEdit=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function load(){try{const r=localStorage.getItem("fichaspa_v1");if(r)DB=JSON.parse(r)}catch(e){}applyCfg()}
function save(){localStorage.setItem("fichaspa_v1",JSON.stringify(DB))}
function applyCfg(){spaTitle.textContent=DB.cfg.nombre||"FichaSpa";spaSub.textContent=(DB.cfg.terapeuta?DB.cfg.terapeuta+" · ":"")+"Expediente local";cfgNombre.value=DB.cfg.nombre||"";cfgTerapeuta.value=DB.cfg.terapeuta||"";cfgCiudad.value=DB.cfg.ciudad||"";cfgTel.value=DB.cfg.tel||""}
function guardarAjustes(){DB.cfg.nombre=cfgNombre.value.trim()||"Mi Spa";DB.cfg.terapeuta=cfgTerapeuta.value.trim();DB.cfg.ciudad=cfgCiudad.value.trim();DB.cfg.tel=cfgTel.value.trim();save();applyCfg();toast("Ajustes guardados")}
document.querySelectorAll("nav.tabs button").forEach(b=>{b.onclick=()=>{document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");["clientes","nueva","ajustes"].forEach(id=>document.getElementById("tab-"+id).classList.toggle("hidden",b.dataset.tab!==id));vistaCliente.classList.add("hidden");if(b.dataset.tab==="nueva")renderForm();if(b.dataset.tab==="clientes")renderLista()}});
function renderLista(){const q=document.getElementById("q").value.toLowerCase();const list=DB.clientes.filter(c=>!q||(c.nombre||"").toLowerCase().includes(q)||(c.tel||"").includes(q));const el=document.getElementById("lista");if(!list.length){el.innerHTML='<div class="empty">Aun no hay clientas.</div>';return}list.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));el.innerHTML=list.map(c=>`<div class="client"><div><b>${esc(c.nombre)}</b><small>${esc(c.tel||"sin telefono")} · ${(c.visitas||[]).length} visita(s)</small></div><button class="btn btn-s" onclick="abrirCliente('${c.id}')">Abrir</button></div>`).join("")}
document.getElementById("q").oninput=renderLista;
function nuevoCliente(){editId=null;visitaEdit=null;document.querySelector('[data-tab="nueva"]').click()}
function clienteVacio(){return{id:uid(),nombre:"",fnac:"",edad:"",tel:"",email:"",dir:"",ocup:"",emergNombre:"",emergTel:"",emergPar:"",referido:"",alergias:"",meds:"",notasMed:"",condiciones:[],peso:"",estatura:"",cintura:"",cadera:"",busto:"",muslo:"",tipoPiel:"",fototipo:"",creado:new Date().toISOString(),visitas:[]}}
function renderForm(){const c=(editId&&DB.clientes.find(x=>x.id===editId))||clienteVacio();const v=visitaEdit||{id:uid(),fecha:new Date().toISOString().slice(0,10),servicio:"Facial",motivo:"",tratamiento:"",productos:"",reaccion:"",recs:"",fotos:[],firmaCli:"",firmaTer:"",acepta:false};
const condHtml=CONDICIONES.map(x=>`<label><input type="checkbox" name="cond" value="${esc(x)}" ${c.condiciones.includes(x)?"checked":""}> ${esc(x)}</label>`).join("");
formFicha.innerHTML=`<h2>${editId?"Actualizar ficha":"Nueva ficha clinica"}</h2>
<h3>1. Datos generales</h3><label>Nombre completo</label><input id="f_nombre" value="${esc(c.nombre)}">
<div class="row"><div><label>Fecha nacimiento</label><input id="f_fnac" type="date" value="${esc(c.fnac)}"></div><div><label>Edad</label><input id="f_edad" value="${esc(c.edad)}"></div></div>
<div class="row"><div><label>Telefono</label><input id="f_tel" value="${esc(c.tel)}"></div><div><label>Correo</label><input id="f_email" value="${esc(c.email)}"></div></div>
<label>Direccion</label><input id="f_dir" value="${esc(c.dir)}">
<div class="row"><div><label>Ocupacion</label><input id="f_ocup" value="${esc(c.ocup)}"></div><div><label>Como nos conocio?</label><input id="f_ref" value="${esc(c.referido)}"></div></div>
<h3>Contacto de emergencia</h3><div class="row3"><div><label>Nombre</label><input id="f_en" value="${esc(c.emergNombre)}"></div><div><label>Parentesco</label><input id="f_ep" value="${esc(c.emergPar)}"></div><div><label>Telefono</label><input id="f_et" value="${esc(c.emergTel)}"></div></div>
<h3>2. Antecedentes</h3><div class="checkgrid">${condHtml}</div>
<label>Alergias</label><textarea id="f_alergias">${esc(c.alergias)}</textarea>
<label>Medicamentos actuales</label><textarea id="f_meds">${esc(c.meds)}</textarea>
<label>Notas / cirugias / tratamientos previos</label><textarea id="f_notasMed">${esc(c.notasMed)}</textarea>
<h3>3. Medidas</h3><div class="row3"><div><label>Peso kg</label><input id="f_peso" value="${esc(c.peso)}"></div><div><label>Estatura cm</label><input id="f_est" value="${esc(c.estatura)}"></div><div><label>Cintura</label><input id="f_cin" value="${esc(c.cintura)}"></div><div><label>Cadera</label><input id="f_cad" value="${esc(c.cadera)}"></div><div><label>Busto</label><input id="f_bus" value="${esc(c.busto)}"></div><div><label>Muslo</label><input id="f_mus" value="${esc(c.muslo)}"></div></div>
<div class="row"><div><label>Tipo de piel</label><select id="f_piel">${["","Normal","Seca","Grasa","Mixta","Sensible"].map(p=>`<option ${c.tipoPiel===p?"selected":""}>${p}</option>`).join("")}</select></div>
<div><label>Fototipo</label><select id="f_foto">${["","I","II","III","IV","V","VI"].map(p=>`<option ${c.fototipo===p?"selected":""}>${p}</option>`).join("")}</select></div></div>
<h3>4. Visita de hoy</h3><div class="row"><div><label>Fecha</label><input id="v_fecha" type="date" value="${esc(v.fecha)}"></div><div><label>Servicio</label><select id="v_serv">${SERVICIOS.map(s=>`<option ${v.servicio===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
<label>Motivo / zona</label><textarea id="v_motivo">${esc(v.motivo)}</textarea>
<label>Tratamiento</label><textarea id="v_trat">${esc(v.tratamiento)}</textarea>
<label>Productos / aparato</label><textarea id="v_prod">${esc(v.productos)}</textarea>
<label>Reaccion</label><textarea id="v_reac">${esc(v.reaccion)}</textarea>
<label>Recomendaciones / proxima cita</label><textarea id="v_recs">${esc(v.recs)}</textarea>
<label>Fotos</label><input type="file" accept="image/*" capture="environment" multiple onchange="addFotos(event)"><div class="photos" id="fotosBox"></div>
<h3>5. Carta responsiva</h3><div class="note">${textoConsentimiento()}</div>
<label class="note" style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input type="checkbox" id="v_ok" ${v.acepta?"checked":""} style="width:18px;height:18px"> Declaro que la informacion es veraz, me explicaron el procedimiento y autorizo el servicio y las fotos solo para mi expediente.</label>
<label>Firma clienta</label><div class="sigbox"><canvas id="sigCli"></canvas></div>
<div class="actions"><button type="button" class="btn btn-s" onclick="clearSig('sigCli')">Borrar firma clienta</button></div>
<label>Firma terapeuta</label><div class="sigbox"><canvas id="sigTer"></canvas></div>
<div class="actions"><button type="button" class="btn btn-s" onclick="clearSig('sigTer')">Borrar firma terapeuta</button></div>
<div class="actions"><button class="btn btn-g" onclick="guardarFicha()">Guardar en el iPad</button><button class="btn btn-s" onclick="guardarYPdf()">Guardar e imprimir / PDF</button></div>`;
window._fotos=v.fotos?[...v.fotos]:[];window._vid=v.id;renderFotos();setupSig("sigCli",v.firmaCli);setupSig("sigTer",v.firmaTer)}
function textoConsentimiento(){const spa=DB.cfg.nombre||"el spa";const ter=DB.cfg.terapeuta||"la terapeuta";return `CARTA DE CONSENTIMIENTO Y RESPONSIVA<br><br>Declaro que informe con veracidad mis antecedentes a <b>${esc(spa)}</b>. Me explicaron el procedimiento, beneficios y posibles molestias (enrojecimiento, sensibilidad, moreton leve, descamacion o manchas temporales). Entiendo que los resultados varian y no se garantizan. Autorizo a ${esc(ter)} a realizar el servicio y a guardar esta ficha en el expediente.`}
function esc(s){return(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&","<":"<",">":">",'"':'"',"'":"&#39;"}[m]))}
function addFotos(ev){[...ev.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const max=900;let w=img.width,h=img.height;if(w>max||h>max){const sc=max/Math.max(w,h);w*=sc;h*=sc}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);window._fotos.push(c.toDataURL("image/jpeg",.72));renderFotos()};img.src=r.result};r.readAsDataURL(f)})}
function renderFotos(){const box=document.getElementById("fotosBox");if(!box)return;box.innerHTML=window._fotos.map((src,i)=>`<img src="${src}" onclick="if(confirm('Quitar foto?')){window._fotos.splice(${i},1);renderFotos()}">`).join("")}
function setupSig(id,existing){const canvas=document.getElementById(id);const ctx=canvas.getContext("2d");const r=canvas.getBoundingClientRect();canvas.width=r.width*2;canvas.height=320;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap="round";ctx.strokeStyle="#2a211c";if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,160);im.src=existing}let draw=false,lx=0,ly=0;const pos=e=>{const rr=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-rr.left,y:t.clientY-rr.top}};const start=e=>{e.preventDefault();draw=true;const p=pos(e);lx=p.x;ly=p.y};const move=e=>{if(!draw)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y};canvas.addEventListener("mousedown",start);canvas.addEventListener("mousemove",move);window.addEventListener("mouseup",()=>draw=false);canvas.addEventListener("touchstart",start,{passive:false});canvas.addEventListener("touchmove",move,{passive:false});canvas.addEventListener("touchend",()=>draw=false)}
function clearSig(id){const c=document.getElementById(id);c.getContext("2d").clearRect(0,0,c.width,c.height)}
function sigData(id){const c=document.getElementById(id);const b=document.createElement("canvas");b.width=c.width;b.height=c.height;return c.toDataURL()===b.toDataURL()?"":c.toDataURL("image/png")}
function leerForm(){const cond=[...document.querySelectorAll("input[name=cond]:checked")].map(i=>i.value);const c={id:editId||uid(),nombre:f_nombre.value.trim(),fnac:f_fnac.value,edad:f_edad.value.trim(),tel:f_tel.value.trim(),email:f_email.value.trim(),dir:f_dir.value.trim(),ocup:f_ocup.value.trim(),referido:f_ref.value.trim(),emergNombre:f_en.value.trim(),emergPar:f_ep.value.trim(),emergTel:f_et.value.trim(),alergias:f_alergias.value.trim(),meds:f_meds.value.trim(),notasMed:f_notasMed.value.trim(),condiciones:cond,peso:f_peso.value.trim(),estatura:f_est.value.trim(),cintura:f_cin.value.trim(),cadera:f_cad.value.trim(),busto:f_bus.value.trim(),muslo:f_mus.value.trim(),tipoPiel:f_piel.value,fototipo:f_foto.value,creado:new Date().toISOString(),visitas:[]};const v={id:window._vid||uid(),fecha:v_fecha.value,servicio:v_serv.value,motivo:v_motivo.value.trim(),tratamiento:v_trat.value.trim(),productos:v_prod.value.trim(),reaccion:v_reac.value.trim(),recs:v_recs.value.trim(),fotos:window._fotos||[],firmaCli:sigData("sigCli"),firmaTer:sigData("sigTer"),acepta:document.getElementById("v_ok").checked};return{c,v}}
function guardarFicha(){const {c,v}=leerForm();if(!c.nombre){toast("Falta el nombre");return null}let prev=DB.clientes.find(x=>x.id===c.id);if(prev){v.id=visitaEdit?visitaEdit.id:v.id;const visitas=prev.visitas||[];const i=visitas.findIndex(x=>x.id===v.id);if(i>=0)visitas[i]=v;else visitas.unshift(v);Object.assign(prev,c,{id:prev.id,creado:prev.creado,visitas})}else{c.visitas=[v];DB.clientes.push(c)}editId=c.id;visitaEdit=v;save();toast("Ficha guardada");return{c:DB.clientes.find(x=>x.id===c.id),v}}
function guardarYPdf(){const r=guardarFicha();if(r)imprimirFicha(r.c,r.v)}
function abrirCliente(id){const c=DB.clientes.find(x=>x.id===id);if(!c)return;document.getElementById("tab-clientes").classList.add("hidden");document.getElementById("tab-nueva").classList.add("hidden");document.getElementById("tab-ajustes").classList.add("hidden");vistaCliente.classList.remove("hidden");const vis=(c.visitas||[]).map(v=>`<div class="card"><b>${esc(v.fecha)} · ${esc(v.servicio)}</b><p class="note">${esc(v.tratamiento||v.motivo||"")}</p><div class="actions"><button class="btn btn-s" onclick="editarVisita('${c.id}','${v.id}')">Editar</button><button class="btn btn-s" onclick="imprimirPorId('${c.id}','${v.id}')">PDF / imprimir</button></div></div>`).join("")||'<p class="note">Sin visitas.</p>';vistaCliente.innerHTML=`<div class="card"><h2>${esc(c.nombre)}</h2><p class="note">${esc(c.tel||"")} ${c.edad?"· "+esc(c.edad)+" anos":""}<br>Alergias: ${esc(c.alergias||"no registradas")}<br>Medicamentos: ${esc(c.meds||"no registrados")}</p><div class="actions"><button class="btn btn-p" onclick="nuevaVisita('${c.id}')">+ Nueva visita</button><button class="btn btn-s" onclick="editarFichaBase('${c.id}')">Editar datos</button><button class="btn btn-d" onclick="borrarCliente('${c.id}')">Eliminar</button><button class="btn btn-s" onclick="document.querySelector('[data-tab=clientes]').click()">Volver</button></div></div><h3>Historial</h3>${vis}`}
function nuevaVisita(id){editId=id;visitaEdit=null;document.querySelector('[data-tab="nueva"]').click()}
function editarFichaBase(id){editId=id;visitaEdit=null;document.querySelector('[data-tab="nueva"]').click()}
function editarVisita(cid,vid){const c=DB.clientes.find(x=>x.id===cid);editId=cid;visitaEdit=(c.visitas||[]).find(v=>v.id===vid);document.querySelector('[data-tab="nueva"]').click()}
function borrarCliente(id){if(!confirm("Eliminar a esta clienta?"))return;DB.clientes=DB.clientes.filter(c=>c.id!==id);save();document.querySelector('[data-tab=clientes]').click()}
function imprimirPorId(cid,vid){const c=DB.clientes.find(x=>x.id===cid);imprimirFicha(c,(c.visitas||[]).find(x=>x.id===vid))}
function imprimirFicha(c,v){const cond=(c.condiciones||[]).join(", ")||"Ninguna";const fotos=(v.fotos||[]).map(src=>`<img src="${src}" style="width:120px;height:120px;object-fit:cover;margin:4px">`).join("");printArea.innerHTML=`<div style="font-family:Georgia,serif;padding:12px"><div style="border-bottom:2px solid #8b4d3b;margin-bottom:12px"><b style="font-size:20px">${esc(DB.cfg.nombre)}</b><div>${esc(DB.cfg.ciudad)} ${esc(DB.cfg.tel||"")}</div><div>FICHA CLINICA</div></div>
<p><b>Clienta:</b> ${esc(c.nombre)} &nbsp; <b>Fecha:</b> ${esc(v.fecha)}<br><b>Edad:</b> ${esc(c.edad||"-")} &nbsp; <b>Tel:</b> ${esc(c.tel||"-")}<br><b>Emergencia:</b> ${esc(c.emergNombre||"-")} ${esc(c.emergTel||"")}</p>
<p><b>Servicio:</b> ${esc(v.servicio)} · ${esc(v.motivo||"")}</p>
<p><b>Condiciones:</b> ${esc(cond)}<br><b>Alergias:</b> ${esc(c.alergias||"No referidas")}<br><b>Medicamentos:</b> ${esc(c.meds||"No referidos")}</p>
<p><b>Medidas:</b> ${esc(c.peso||"-")} kg · cintura ${esc(c.cintura||"-")} · cadera ${esc(c.cadera||"-")}</p>
<p><b>Tratamiento:</b> ${esc(v.tratamiento||"-")}<br><b>Productos:</b> ${esc(v.productos||"-")}<br><b>Reaccion:</b> ${esc(v.reaccion||"-")}<br><b>Recs:</b> ${esc(v.recs||"-")}</p>
<div>${fotos}</div><div style="font-size:12px;margin-top:12px">${textoConsentimiento()}<p>${v.acepta?"Acepto la declaracion.":""}</p></div>
