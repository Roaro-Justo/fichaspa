<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d2b24">
<title>FichaSpa</title>
<style>
:root{--bg:#f4efe8;--card:#fffdf9;--ink:#2a211c;--muted:#6e5e55;--line:#e4d6c8;--accent:#8b4d3b;--ok:#2f6b4f;--warn:#9a3b2a;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;min-height:100%}
header.app{position:sticky;top:0;z-index:20;background:#3d2b24;color:#f8f1ea;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header.app h1{margin:0;font-size:18px}.sub{opacity:.8;font-size:12px}
nav.tabs{display:flex;gap:8px;padding:10px 12px;background:#efe6dc;position:sticky;top:52px;z-index:15}
nav.tabs button{flex:1;border:0;background:#fff;border-radius:999px;padding:10px;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--accent);color:#fff}
.wrap{padding:14px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:18px 0 8px;color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px}
textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.row,.row3{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
.btn-p{background:var(--accent);color:#fff}.btn-s{background:#efe6dc}.btn-g{background:var(--ok);color:#fff}.btn-d{background:#f3e4e0;color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.search{width:100%;margin-bottom:10px}
.client{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.client small{color:var(--muted)}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0}.checkgrid input{width:18px;height:18px}
.sigbox canvas{width:100%;height:140px;touch-action:none;border:1px dashed #c9b6a6;border-radius:12px}
.photos img,.mini img{object-fit:cover;border-radius:8px}.photos img{width:92px;height:92px;margin:4px}.mini img{width:64px;height:64px;margin:3px}
.hidden{display:none!important}.empty,.note{color:var(--muted);font-size:13px}
details.blk{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;background:#faf6f1}
details.blk>summary{font-weight:700;color:var(--accent);padding:8px 0}
.phblock{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a211c;color:#fff;padding:10px 16px;border-radius:999px;opacity:0}#toast.show{opacity:1}
@media print{header.app,nav.tabs,.no-print,#toast{display:none!important}.print-only{display:block!important}}.print-only{display:none}
</style></head>
<body>
<header class="app"><h1 id="spaTitle">FichaSpa</h1><div class="sub" id="spaSub">Expediente local</div></header>
<nav class="tabs no-print"><button class="on" data-tab="clientes">Clientes</button><button data-tab="nueva">Nueva ficha</button><button data-tab="ajustes">Ajustes</button></nav>
<div class="wrap">
<section id="tab-clientes"><input class="search" id="q" placeholder="Buscar"><div class="actions no-print"><button class="btn btn-p" onclick="nuevoCliente()">+ Nueva clienta</button></div><div class="card" id="lista"></div></section>
<section id="tab-nueva" class="hidden"><div class="card" id="formFicha"></div></section>
<section id="tab-ajustes" class="hidden"><div class="card"><h2>Datos del spa</h2>
<label>Nombre</label><input id="cfgNombre"><label>Terapeuta</label><input id="cfgTerapeuta">
<label>Ciudad</label><input id="cfgCiudad"><label>Telefono</label><input id="cfgTel">
<div class="actions"><button class="btn btn-p" onclick="guardarAjustes()">Guardar</button></div>
<div class="actions"><button class="btn btn-s" onclick="exportarJSON()">Exportar</button>
<button class="btn btn-s" onclick="document.getElementById('imp').click()">Importar</button>
<input id="imp" type="file" accept="application/json" class="hidden" onchange="importarJSON(event)"></div></div></section>
<div id="vistaCliente" class="hidden"></div><div id="printArea" class="print-only"></div></div><div id="toast"></div>
<script>
const COND=["Embarazo","Lactancia","Hipertension","Diabetes","Cardiacos","Epilepsia","Asma","Cancer","Tiroides","Coagulacion","Herpes","Rosacea","Acne","Eccema","Queloides","Marcapasos","Cirugia 12m","Isotretinoina","Alergia latex","Tatuaje zona","Sol reciente","Herida"];
const SERV=["Facial","Limpieza","Peeling","Masaje","Corporal","Depilacion","Cejas","Otro"];
let DB={cfg:{nombre:"Mi Spa",terapeuta:"",ciudad:"Celaya, Gto.",tel:""},clientes:[]},editId=null,visitaEdit=null,modoNV=false;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)};
const load=()=>{try{const r=localStorage.getItem("fichaspa_v1");if(r)DB=JSON.parse(r)}catch(e){}cfg()};
const save=()=>localStorage.setItem("fichaspa_v1",JSON.stringify(DB));
function cfg(){$("spaTitle").textContent=DB.cfg.nombre||"FichaSpa";$("spaSub").textContent=DB.cfg.terapeuta||"Expediente local";["Nombre","Terapeuta","Ciudad","Tel"].forEach(()=>{});$("cfgNombre").value=DB.cfg.nombre||"";$("cfgTerapeuta").value=DB.cfg.terapeuta||"";$("cfgCiudad").value=DB.cfg.ciudad||"";$("cfgTel").value=DB.cfg.tel||""}
function guardarAjustes(){DB.cfg={nombre:$("cfgNombre").value.trim()||"Mi Spa",terapeuta:$("cfgTerapeuta").value.trim(),ciudad:$("cfgCiudad").value.trim(),tel:$("cfgTel").value.trim()};save();cfg();toast("Guardado")}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");["clientes","nueva","ajustes"].forEach(id=>$("tab-"+id).classList.toggle("hidden",b.dataset.tab!==id));$("vistaCliente").classList.add("hidden");if(b.dataset.tab==="nueva"){if(!editId)modoNV=false;form()}if(b.dataset.tab==="clientes")lista()});
function lista(){const q=$("q").value.toLowerCase();const L=DB.clientes.filter(c=>!q||(c.nombre||"").toLowerCase().includes(q)||(c.tel||"").includes(q)).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));$("lista").innerHTML=L.length?L.map(c=>`<div class="client"><div><b>${esc(c.nombre)}</b><small>${esc(c.tel||"")} · ${(c.visitas||[]).length} visitas</small></div><button class="btn btn-s" onclick="abrir('${c.id}')">Abrir</button></div>`).join(""):'<div class="empty">Aun no hay clientas.</div>'}
$("q").oninput=lista;
function nuevoCliente(){editId=null;visitaEdit=null;modoNV=false;document.querySelector('[data-tab=nueva]').click()}
function vacio(){return{id:uid(),nombre:"",fnac:"",edad:"",tel:"",email:"",dir:"",ocup:"",emergNombre:"",emergTel:"",emergPar:"",referido:"",alergias:"",meds:"",notasMed:"",condiciones:[],peso:"",estatura:"",cintura:"",cadera:"",busto:"",muslo:"",tipoPiel:"",fototipo:"",creado:new Date().toISOString(),visitas:[]}}
function nv(v){v=v||{};return{id:v.id||uid(),fecha:v.fecha||new Date().toISOString().slice(0,10),servicio:v.servicio||"Facial",motivo:v.motivo||"",tratamiento:v.tratamiento||"",productos:v.productos||"",reaccion:v.reaccion||"",recs:v.recs||"",fotosAntes:v.fotosAntes||v.fotos||[],fotosDespues:v.fotosDespues||[],fotosSeg:v.fotosSeg||[],notaSeg:v.notaSeg||"",firmaCli:v.firmaCli||"",firmaTer:v.firmaTer||"",acepta:!!v.acepta}}
function thumbs(a){return(a||[]).map(s=>`<img src="${s}">`).join("")}
function form(){
 const c=(editId&&DB.clientes.find(x=>x.id===editId))||vacio(); const v=nv(visitaEdit);
 const col=!!(editId&&modoNV); const op=col?"":"open";
 const ch=COND.map(x=>`<label><input type=checkbox name=cond value="${esc(x)}" ${c.condiciones.includes(x)?"checked":""}> ${esc(x)}</label>`).join("");
 const prev=(!visitaEdit&&c.visitas&&c.visitas[0])?c.visitas[0]:null;
 $("formFicha").innerHTML=`<h2>${!editId?"Nueva ficha":(modoNV?"Nueva visita · "+esc(c.nombre):"Editar · "+esc(c.nombre))}</h2>
 ${col?'<p class="note">Datos guardados. Abre un bloque solo si hay que corregir.</p>':''}
 <details class=blk ${op}><summary>1. Datos generales</summary>
 <label>Nombre</label><input id=f_nombre value="${esc(c.nombre)}">
 <div class=row><div><label>Nacimiento</label><input id=f_fnac type=date value="${esc(c.fnac)}"></div><div><label>Edad</label><input id=f_edad value="${esc(c.edad)}"></div></div>
 <div class=row><div><label>Telefono</label><input id=f_tel value="${esc(c.tel)}"></div><div><label>Correo</label><input id=f_email value="${esc(c.email)}"></div></div>
 <label>Direccion</label><input id=f_dir value="${esc(c.dir)}">
 <div class=row><div><label>Ocupacion</label><input id=f_ocup value="${esc(c.ocup)}"></div><div><label>Como nos conocio</label><input id=f_ref value="${esc(c.referido)}"></div></div>
 <div class=row3><div><label>Emergencia</label><input id=f_en value="${esc(c.emergNombre)}"></div><div><label>Parentesco</label><input id=f_ep value="${esc(c.emergPar)}"></div><div><label>Tel</label><input id=f_et value="${esc(c.emergTel)}"></div></div></details>
 <details class=blk ${op}><summary>2. Antecedentes</summary><div class=checkgrid>${ch}</div>
 <label>Alergias</label><textarea id=f_alergias>${esc(c.alergias)}</textarea>
 <label>Medicamentos</label><textarea id=f_meds>${esc(c.meds)}</textarea>
 <label>Notas</label><textarea id=f_notasMed>${esc(c.notasMed)}</textarea></details>
 <details class=blk ${op}><summary>3. Medidas</summary>
 <div class=row3><div><label>Peso</label><input id=f_peso value="${esc(c.peso)}"></div><div><label>Estatura</label><input id=f_est value="${esc(c.estatura)}"></div><div><label>Cintura</label><input id=f_cin value="${esc(c.cintura)}"></div>
 <div><label>Cadera</label><input id=f_cad value="${esc(c.cadera)}"></div><div><label>Busto</label><input id=f_bus value="${esc(c.busto)}"></div><div><label>Muslo</label><input id=f_mus value="${esc(c.muslo)}"></div></div>
 <div class=row><div><label>Piel</label><select id=f_piel>${["","Normal","Seca","Grasa","Mixta","Sensible"].map(p=>`<option ${c.tipoPiel===p?"selected":""}>${p}</option>`).join("")}</select></div>
 <div><label>Fototipo</label><select id=f_foto>${["","I","II","III","IV","V","VI"].map(p=>`<option ${c.fototipo===p?"selected":""}>${p}</option>`).join("")}</select></div></div></details>
 <h3>4. Visita de hoy</h3>
 <div class=row><div><label>Fecha</label><input id=v_fecha type=date value="${esc(v.fecha)}"></div><div><label>Servicio</label><select id=v_serv>${SERV.map(s=>`<option ${v.servicio===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
 <label>Motivo</label><textarea id=v_motivo>${esc(v.motivo)}</textarea>
 <label>Tratamiento</label><textarea id=v_trat>${esc(v.tratamiento)}</textarea>
 <label>Productos</label><textarea id=v_prod>${esc(v.productos)}</textarea>
 <label>Reaccion</label><textarea id=v_reac>${esc(v.reaccion)}</textarea>
 <label>Recomendaciones</label><textarea id=v_recs>${esc(v.recs)}</textarea>
 ${prev?`<details class=blk><summary>Fotos visita anterior</summary><div class=mini>${thumbs(prev.fotosAntes||prev.fotos)}${thumbs(prev.fotosDespues)}${thumbs(prev.fotosSeg)}</div></details>`:""}
 <div class=phblock><h3>Fotos ANTES</h3><input type=file accept="image/*" capture=environment multiple onchange="addF(event,'antes')"><div class=photos id=boxAntes></div></div>
 <div class=phblock><h3>Fotos DESPUES</h3><input type=file accept="image/*" capture=environment multiple onchange="addF(event,'despues')"><div class=photos id=boxDespues></div></div>
 <div class=phblock><h3>Seguimiento</h3><input type=file accept="image/*" capture=environment multiple onchange="addF(event,'seg')"><div class=photos id=boxSeg></div>
 <label>Comentario</label><textarea id=v_notaSeg>${esc(v.notaSeg)}</textarea></div>
 <details class=blk ${col?"":"open"}><summary>5. Responsiva y firmas</summary>
 <p class=note>${cons()}</p>
 <label class=note style="display:flex;gap:8px"><input type=checkbox id=v_ok ${v.acepta?"checked":""} style="width:18px;height:18px"> Autorizo el servicio y las fotos para el expediente.</label>
 <label>Firma clienta</label><div class=sigbox><canvas id=sigCli></canvas></div>
 <button type=button class="btn btn-s" onclick="clr('sigCli')">Borrar</button>
 <label>Firma terapeuta</label><div class=sigbox><canvas id=sigTer></canvas></div>
 <button type=button class="btn btn-s" onclick="clr('sigTer')">Borrar</button></details>
 <div class=actions><button class="btn btn-g" onclick="guardar()">Guardar</button><button class="btn btn-s" onclick="guardarPdf()">PDF / imprimir</button></div>`;
 window._f={antes:[...v.fotosAntes],despues:[...v.fotosDespues],seg:[...v.fotosSeg]}; window._vid=v.id; drawF(); sig("sigCli",v.firmaCli); sig("sigTer",v.firmaTer);
}
function cons(){return `CARTA RESPONSIVA. Informe antecedentes a <b>${esc(DB.cfg.nombre)}</b>. Me explicaron el procedimiento. Autorizo a ${esc(DB.cfg.terapeuta||"la terapeuta")} y el archivo fotografico del expediente.`}
function esc(s){return(s??"").toString().replace(/[&<>"']/g,m=>({ "&":"&","<":"<",">":">","\"":""","'":"&#39;"}[m]))}
function addF(ev,t){[...ev.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");let w=img.width,h=img.height,m=900;if(w>m||h>m){const s=m/Math.max(w,h);w*=s;h*=s}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);window._f[t].push(c.toDataURL("image/jpeg",.72));drawF()};img.src=r.result};r.readAsDataURL(f)})}
function drawF(){["antes","despues","seg"].forEach(k=>{const b=$("box"+k[0].toUpperCase()+k.slice(1)); if(k=="antes")$("boxAntes");});
 [["antes","boxAntes"],["despues","boxDespues"],["seg","boxSeg"]].forEach(([k,id])=>{const b=$(id);if(!b)return;b.innerHTML=(window._f[k]||[]).map((s,i)=>`<img src="${s}" onclick="if(confirm('Quitar?')){window._f['${k}'].splice(${i},1);drawF()}">`).join("")})}
function sig(id,ex){const c=$(id);if(!c)return;const x=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*2;c.height=280;x.scale(2,2);x.lineWidth=2;x.lineCap="round";if(ex){const i=new Image();i.onload=()=>x.drawImage(i,0,0,r.width,140);i.src=ex}let d=0,lx=0,ly=0;const p=e=>{const rr=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-rr.left,y:t.clientY-rr.top}};const st=e=>{e.preventDefault();d=1;const q=p(e);lx=q.x;ly=q.y};const mv=e=>{if(!d)return;e.preventDefault();const q=p(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(q.x,q.y);x.stroke();lx=q.x;ly=q.y};c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",()=>d=0);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",()=>d=0)}
function clr(id){const c=$(id);c.getContext("2d").clearRect(0,0,c.width,c.height)}
function sigD(id){const c=$(id);if(!c)return"";const b=document.createElement("canvas");b.width=c.width;b.height=c.height;return c.toDataURL()===b.toDataURL()?"":c.toDataURL()}
function leer(){const cond=[...document.querySelectorAll("input[name=cond]:checked")].map(i=>i.value);
 const c={id:editId||uid(),nombre:$("f_nombre").value.trim(),fnac:$("f_fnac").value,edad:$("f_edad").value,tel:$("f_tel").value,email:$("f_email").value,dir:$("f_dir").value,ocup:$("f_ocup").value,referido:$("f_ref").value,emergNombre:$("f_en").value,emergPar:$("f_ep").value,emergTel:$("f_et").value,alergias:$("f_alergias").value,meds:$("f_meds").value,notasMed:$("f_notasMed").value,condiciones:cond,peso:$("f_peso").value,estatura:$("f_est").value,cintura:$("f_cin").value,cadera:$("f_cad").value,busto:$("f_bus").value,muslo:$("f_mus").value,tipoPiel:$("f_piel").value,fototipo:$("f_foto").value,creado:new Date().toISOString(),visitas:[]};
 const v={id:window._vid||uid(),fecha:$("v_fecha").value,servicio:$("v_serv").value,motivo:$("v_motivo").value,tratamiento:$("v_trat").value,productos:$("v_prod").value,reaccion:$("v_reac").value,recs:$("v_recs").value,fotosAntes:window._f.antes,fotosDespues:window._f.despues,fotosSeg:window._f.seg,notaSeg:$("v_notaSeg").value,firmaCli:sigD("sigCli"),firmaTer:sigD("sigTer"),acepta:!!$("v_ok")&&$("v_ok").checked};return{c,v}}
function guardar(){const {c,v}=leer();if(!c.nombre){toast("Falta nombre");return null}let p=DB.clientes.find(x=>x.id===c.id);if(p){v.id=visitaEdit?visitaEdit.id:v.id;const vs=p.visitas||[];const i=vs.findIndex(x=>x.id===v.id);if(i>=0)vs[i]=v;else vs.unshift(v);Object.assign(p,c,{id:p.id,creado:p.creado,visitas:vs})}else{c.visitas=[v];DB.clientes.push(c)}editId=c.id;visitaEdit=v;save();toast("Guardado");return{c:DB.clientes.find(x=>x.id===c.id),v}}
function guardarPdf(){const r=guardar();if(r)imp(r.c,r.v)}
function abrir(id){const c=DB.clientes.find(x=>x.id===id);["tab-clientes","tab-nueva","tab-ajustes"].forEach(i=>$(i).classList.add("hidden"));$("vistaCliente").classList.remove("hidden");
 const vis=(c.visitas||[]).map(v=>{const n=nv(v);return `<div class=card><b>${esc(n.fecha)} · ${esc(n.servicio)}</b><p class=note>${esc(n.tratamiento||n.motivo||"")}</p>
 <div class=note>Antes</div><div class=mini>${thumbs(n.fotosAntes)}</div><div class=note>Despues</div><div class=mini>${thumbs(n.fotosDespues)}</div>
 <div class=note>Seguimiento</div><div class=mini>${thumbs(n.fotosSeg)}</div>${n.notaSeg?`<p class=note>${esc(n.notaSeg)}</p>`:""}
 <div class=actions><button class="btn btn-s" onclick="edVis('${c.id}','${n.id}')">Editar</button><button class="btn btn-s" onclick="impId('${c.id}','${n.id}')">PDF</button></div></div>`}).join("")||'<p class=note>Sin visitas</p>';
 $("vistaCliente").innerHTML=`<div class=card><h2>${esc(c.nombre)}</h2><p class=note>${esc(c.tel||"")}<br>Alergias: ${esc(c.alergias||"-")}</p>
 <div class=actions><button class="btn btn-p" onclick="nVis('${c.id}')">+ Nueva visita</button><button class="btn btn-s" onclick="edBase('${c.id}')">Editar datos</button>
 <button class="btn btn-d" onclick="bor('${c.id}')">Eliminar</button><button class="btn btn-s" onclick="document.querySelector('[data-tab=clientes]').click()">Volver</button></div></div><h3>Historial</h3>${vis}`}
function nVis(id){editId=id;visitaEdit=null;modoNV=true;document.querySelector('[data-tab=nueva]').click()}
function edBase(id){editId=id;visitaEdit=null;modoNV=false;document.querySelector('[data-tab=nueva]').click()}
function edVis(cid,vid){const c=DB.clientes.find(x=>x.id===cid);editId=cid;visitaEdit=nv((c.visitas||[]).find(v=>v.id===vid));modoNV=true;document.querySelector('[data-tab=nueva]').click()}
function bor(id){if(!confirm("Eliminar?"))return;DB.clientes=DB.clientes.filter(c=>c.id!==id);save();document.querySelector('[data-tab=clientes]').click()}
function impId(cid,vid){const c=DB.clientes.find(x=>x.id===cid);imp(c,nv((c.visitas||[]).find(x=>x.id===vid)))}
function imp(c,v){v=nv(v);const b=(t,a)=>a&&a.length?`<div><b>${t}</b><br>${a.map(s=>`<img src="${s}" style="width:110px;height:110px;object-fit:cover">`).join("")}</div>`:"";
 $("printArea").innerHTML=`<div style="font-family:Georgia;padding:12px"><b>${esc(DB.cfg.nombre)}</b><p>${esc(c.nombre)} · ${esc(v.fecha)} · ${esc(v.servicio)}</p>
 <p>Alergias: ${esc(c.alergias||"-")} · Meds: ${esc(c.meds||"-")}</p><p>${esc(v.tratamiento||"")}</p>${b("ANTES",v.fotosAntes)}${b("DESPUES",v.fotosDespues)}${b("SEG",v.fotosSeg)}
 <p>${esc(v.notaSeg||"")}</p><p>${cons()}</p>
 <div style="display:flex;gap:40px">${v.firmaCli?`<img src="${v.firmaCli}" style="height:70px">`:""} ${v.firmaTer?`<img src="${v.firmaTer}" style="height:70px">`:""}</div></div>`;window.print()}
